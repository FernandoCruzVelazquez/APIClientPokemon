
<div class="detail-container" *ngIf="pokemon" [ngClass]="pokemon.tipos[0].eng">
  <div class="glass-card">
    <button class="back-btn" routerLink="/pokedex">
      <i class="bi bi-arrow-left"></i> Volver
    </button>

    <div class="detail-header">
      <span class="detail-id">#{{ pokemon.id }}</span>
      <h1 class="detail-name">{{ pokemon.nombre | uppercase }}</h1>
    </div>

    <div class="detail-content">
      <div class="image-box">
        <img [src]="pokemon.imagen" [alt]="pokemon.nombre">
      </div>

      <div class="stats-box">
        <h3>ESTADÍSTICAS BASE</h3>
        <div class="stat-row">
          <span>HP</span>
          <div class="bar-container">
            <!-- Verifica si es pokemon.hp o pokemon.stats.hp -->
            <div class="bar" [style.width.%]="(pokemon.stats?.hp / 255) * 100"></div>
          </div>
          <span>{{ pokemon.stats?.hp }}</span>
        </div>
        
        <div class="info-grid">
          <div class="info-item">
            <p class="label">Habilidad</p>
            <p class="value">{{ pokemon.habilidad }}</p>
          </div>
          <div class="info-item">
            <p class="label">Movimiento</p>
            <p class="value">{{ pokemon.ataque }}</p>
          </div>
        </div>

        <div class="types-row">
          <span *ngFor="let t of pokemon.tipos" class="type-badge" [ngClass]="t.eng">
            {{ t.esp }}
          </span>
        </div>

        <div class="radar-chart-container">
          <h3>ANÁLISIS DE COMBATE</h3>
          <svg width="250" height="250" viewBox="0 0 200 200" style="overflow: visible;">
            <polygon points="100,0 186,50 186,150 100,200 14,150 14,50" class="chart-bg" />
            <polygon points="100,25 164,62 164,137 100,175 36,137 36,62" class="chart-bg" />
            <polygon points="100,50 143,75 143,125 100,150 57,125 57,75" class="chart-bg" />
            
            <line x1="100" y1="100" x2="100" y2="0" stroke="rgba(255,255,255,0.1)" />
            <line x1="100" y1="100" x2="186" y2="50" stroke="rgba(255,255,255,0.1)" />
            <line x1="100" y1="100" x2="186" y2="150" stroke="rgba(255,255,255,0.1)" />
            <line x1="100" y1="100" x2="100" y2="200" stroke="rgba(255,255,255,0.1)" />
            <line x1="100" y1="100" x2="14" y2="150" stroke="rgba(255,255,255,0.1)" />
            <line x1="100" y1="100" x2="14" y2="50" stroke="rgba(255,255,255,0.1)" />

            <polygon [attr.points]="getPolygonPoints()" class="chart-poly" />
            
            <text x="100" y="-10" text-anchor="middle">HP</text>
            <text x="200" y="50">ATK</text>
            <text x="200" y="160">DEF</text>
            <text x="100" y="220" text-anchor="middle">SPD</text>
            <text x="-30" y="160">S.DEF</text>
            <text x="-30" y="50">S.ATK</text>
          </svg>
        </div>

      </div>
    </div>
  </div>
</div>
