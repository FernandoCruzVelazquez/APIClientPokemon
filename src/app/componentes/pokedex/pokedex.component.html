<div class="pokedex-container">
  <div class="pokemon-bg"></div>

  <div class="pokedex-panel animate-in">

    <div class="pokedex-header">
      <h1 class="title">POKÉDEX</h1>
      <div class="search-wrapper">
        <input 
          type="text"
          placeholder="Ej: Pikachu, Fuego, 25..."
          [(ngModel)]="search"
          (input)="filtrar()"
          class="search-input"
        >
      </div>
    </div>

    <div class="pokemon-grid">
      <div 
        class="pokemon-card" 
        *ngFor="let poke of pokemonsPaginados" 
        [ngClass]="poke.tipos[0].eng"
      >
        <div class="card-inner" [ngClass]="'type-' + poke.tipos[0].eng">
          
          <div class="card-top-bar">
            <div class="name-id">
              <span class="card-rarity">POKÉMON</span>
              <h3 class="pokemon-name">{{ poke.nombre }}</h3>
            </div>
            <span class="pokemon-id">#{{ poke.id }}</span>
          </div>

          <div class="hp-section">
            <span class="hp-label">HP</span>
            <span class="hp-value">{{ poke.hp }}</span>
          </div>

          <div class="img-container">
            <img [src]="poke.imagen" class="pokemon-img" [alt]="poke.nombre" loading="lazy">
          </div>

          <div class="pokemon-info">
            <div class="ability-section">
              <div class="ability-header">
                <span class="ability-symbol">⭐</span>
                <p class="ability-name">Habilidad: {{ poke.habilidad | titlecase }}</p>
              </div>
              <div class="ability-divider"></div>
              <p class="ability-desc">
                Movimiento: <strong>{{ poke.ataque | titlecase }}</strong>
              </p>
            </div>
            
            <div class="action-container">
              <button class="save-btn" (click)="onGuardar(poke)">
                <span class="btn-icon">🔘</span> 
                GUARDAR
              </button>

              <button class="stats-btn" [routerLink]="['/pokemon', poke.id]">
                <div class="btn-glow"></div>
                <i class="bi bi-graph-up"></i>
              </button>
            </div>
          </div>

          <div class="card-footer-tcg">
            <div class="footer-decor"></div>
            <div class="types-wrapper">
              <span 
                *ngFor="let t of poke.tipos" 
                class="type-badge" 
                [ngClass]="t.eng"
              >
                {{ t.esp }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    
    <div class="pagination-wrapper" *ngIf="totalPaginas > 1">
      <button 
        class="pagination-btn" 
        (click)="cambiarPagina(paginaActual - 1)" 
        [disabled]="paginaActual === 1">
        ◀
      </button>

      <div class="pagination-info">
        <span>ENTRENADOR, PÁGINA</span>
        <strong class="current-page">{{ paginaActual }}</strong>
        <span>DE {{ totalPaginas }}</span>
      </div>

      <button 
        class="pagination-btn" 
        (click)="cambiarPagina(paginaActual + 1)" 
        [disabled]="paginaActual === totalPaginas">
        ▶
      </button>
    </div>

  </div>
</div>
