<div class="pokedex-container">
  <div class="pokemon-bg"></div>

  <div class="pokedex-panel animate-in">
    <div class="pokedex-header">
      <h1 class="title">MIS FAVORITOS</h1>
    </div>

    <div *ngIf="isLoadingFavoritos" class="loader-container">
      <div class="pokeball-loader">
        <div class="pokeball-top"></div>
        <div class="pokeball-center"></div>
        <div class="pokeball-bottom"></div>
      </div>
      <p class="loading-text">CARGANDO FAVORITOS...</p>
    </div>

    <div class="pokemon-grid" *ngIf="!isLoadingFavoritos">
      <div class="pokemon-card" *ngFor="let fav of favoritos">
        
        <div class="card-inner">
          <div class="card-top-bar">
            <div class="name-id">
              <span class="card-rarity">FAVORITO</span>
              <h3 class="pokemon-name">{{ fav.pokemon.nombrepokemon | titlecase }}</h3>
            </div>
            <span class="pokemon-id">#{{ fav.pokemon.idpokemon }}</span>
          </div>

          <div class="img-container">
            <img [src]="fav.pokemon.imagen" class="pokemon-img" [alt]="fav.pokemon.nombrepokemon">
          </div>

          <div class="pokemon-info">
             <div class="ability-section">
                <p class="ability-desc" style="text-align: center; padding-top: 10px;">
                  ¡Este Pokémon es uno de tus compañeros favoritos!
                </p>
             </div>
            
            <div class="action-container">
              <button class="delete-btn" (click)="eliminar(fav.pokemon.idpokemon)">
                <span class="btn-icon">🗑️</span> 
                ELIMINAR
              </button>
            </div>

            <button class="stats-btn" [routerLink]="['/pokemon', fav.pokemon.idpokemon]">
              <div class="btn-glow"></div>
              <i class="bi bi-graph-up"></i>
            </button>
          </div>

          <div class="card-footer-tcg">
            <div class="footer-decor"></div>
          </div>
        </div>

      </div>
    </div>

    <div *ngIf="favoritos.length === 0 && !isLoadingFavoritos" class="pagination-info" style="margin: 50px auto; width: fit-content;">
      <span>AÚN NO TIENES POKÉMON FAVORITOS</span>
    </div>

  </div>
</div>
