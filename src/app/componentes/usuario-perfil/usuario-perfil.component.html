<div class="perfil-container">
  <div class="usuarios-bg"></div>

  <div class="container contenido pt-5">
    <div class="card pokedex-card shadow-lg mx-auto" style="max-width: 800px;">
      <div class="card-header text-center">
        <h2 class="title-perfil">FICHA DE ENTRENADOR</h2>
      </div>

      <div class="card-body p-4">
        <div class="row">
          <!-- Lado Izquierdo: Foto de Perfil -->
          <div class="col-md-4 text-center border-end border-secondary">
            <div class="image-preview-container mb-3">
              <img
                [src]="imagePreview || (usuario.imagen ? 'data:image/jpeg;base64,' + usuario.imagen : 'https://cdn-icons-png.flaticon.com/512/287/287226.png')"
                class="img-thumbnail rounded-circle profile-img-edit" />
            </div>

            <label class="btn btn-outline-warning btn-sm w-100">
              <i class="bi bi-camera-fill"></i> CAMBIAR FOTO
              <input type="file" (change)="onFileSelected($event)" hidden accept="image/*">
            </label>
            <p class="text-muted small mt-2">Formatos: JPG, PNG. Máx 2MB</p>

            <button type="button" (click)="desactivar()" class="btn btn-danger btn-poke">
              Desactivar cuenta
            </button>

          </div>

          <!-- Lado Derecho: Datos del Formulario -->
          <div class="col-md-8">
            <form (ngSubmit)="updateUsuario()" #perfilForm="ngForm">

              <!-- Fila 1: Nombre y Apellido Paterno -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="label-pokedex">NOMBRE</label>
                  <input type="text" class="form-control input-pokedex" [(ngModel)]="usuario.nombreusuario"
                    name="nombre" required maxlength="100" pattern="^[a-zA-ZÁÉÍÓÚáéíóúñÑ ]+$" #nombreModel="ngModel">
                  <div *ngIf="nombreModel.invalid && nombreModel.touched" class="text-danger small">
                    Nombre inválido
                  </div>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="label-pokedex">APELLIDO PATERNO</label>
                  <input type="text" class="form-control input-pokedex" [(ngModel)]="usuario.apellidopaterno"
                    name="apellidopaterno" required maxlength="50" pattern="^[a-zA-ZÁÉÍÓÚáéíóúñÑ ]+$"
                    #apellidoPModel="ngModel">
                  <div *ngIf="apellidoPModel.invalid && apellidoPModel.touched" class="text-danger small">
                    Apellido paterno inválido
                  </div>
                </div>
              </div>

              <!-- Fila 2: Apellido Materno y Username -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="label-pokedex">APELLIDO MATERNO</label>
                  <input type="text" class="form-control input-pokedex" [(ngModel)]="usuario.apellidomaterno"
                    name="apellidomaterno" maxlength="50" pattern="^[a-zA-ZÁÉÍÓÚáéíóúñÑ ]+$" #apellidoMModel="ngModel">
                  <div *ngIf="apellidoMModel.invalid && apellidoMModel.touched" class="text-danger small">
                    Apellido materno inválido
                  </div>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="label-pokedex">USUARIO</label>
                  <input type="text" class="form-control input-pokedex" [(ngModel)]="usuario.username" name="username"
                    required maxlength="50" pattern="^[a-zA-Z0-9_]+$" #usernameModel="ngModel">
                  <div *ngIf="usernameModel.invalid && usernameModel.touched" class="text-danger small">
                    Usuario inválido (letras y números)
                  </div>
                </div>
              </div>

              <!-- Fila 3: Correo -->
              <div class="mb-3">
                <label class="label-pokedex">CORREO ELECTRÓNICO</label>
                <input type="email" class="form-control input-pokedex" [(ngModel)]="usuario.correo" name="correo"
                  required maxlength="60" email #correoModel="ngModel">
                <div *ngIf="correoModel.invalid && correoModel.touched" class="text-danger small">
                  Correo electrónico inválido
                </div>
              </div>

              <!-- BOTÓN INTERRUPTOR PARA CONTRASEÑA -->
              <div class="mt-4 mb-3">
                <button type="button" (click)="togglePasswordSection()"
                  class="btn btn-outline-secondary btn-sm shadow-sm">
                  <i class="bi" [ngClass]="showPasswordSection ? 'bi-x-lg' : 'bi-shield-lock-fill'"></i>
                  {{ showPasswordSection ? ' CANCELAR CAMBIO DE CONTRASEÑA' : ' CAMBIAR CONTRASEÑA' }}
                </button>
              </div>

              <!-- SECCIÓN DESPLEGABLE DE CONTRASEÑA -->
              <div *ngIf="showPasswordSection" class="p-3 mb-4 rounded-3 border border-warning bg-light shadow-sm">
                <h6 class="label-pokedex text-warning mb-3">ACTUALIZAR CREDENCIALES</h6>

                <div class="mb-3">
                  <label class="label-pokedex">CONTRASEÑA ACTUAL</label>
                  <input type="password" class="form-control input-pokedex" [(ngModel)]="currentPassword"
                    name="currentPassword" placeholder="Tu clave actual">
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="label-pokedex">NUEVA CONTRASEÑA</label>
                    <input type="password" class="form-control input-pokedex" [(ngModel)]="newPassword"
                      name="newPassword" placeholder="Mínimo 6 caracteres">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="label-pokedex">REPETIR NUEVA</label>
                    <input type="password" class="form-control input-pokedex" [(ngModel)]="confirmNewPassword"
                      name="confirmNewPassword" placeholder="Confirma clave">
                  </div>
                </div>
              </div>

              <!-- ACCIONES FINALES -->
              <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success btn-poke flex-grow-1"
                  [disabled]="perfilForm.invalid || isLoading">
                  <i class="bi bi-save"></i> GUARDAR CAMBIOS
                </button>
                <button type="button" (click)="cancelar()" class="btn btn-secondary btn-poke">
                  CANCELAR
                </button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
