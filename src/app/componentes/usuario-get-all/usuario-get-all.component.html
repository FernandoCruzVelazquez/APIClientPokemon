<div class="usuarios-container">
    <div class="usuarios-bg"></div>

    <div class="container contenido">
        <div class="row pt-5 mb-4 align-items-center">
            <div class="col-12 text-center text-md-start">
                <h1 class="title"><i class="bi bi-person-lines-fill"></i> REGISTRO DE ENTRENADORES</h1>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4 p-3 bg-light">
            <div class="row g-2">
                <div class="col-md-2">
                    <label class="form-label small fw-bold">ID</label>
                    <input type="text" class="form-control form-control-sm" placeholder="#00" 
                           [(ngModel)]="filtros.id" (input)="filtrarUsuarios()">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Nombre</label>
                    <input type="text" class="form-control form-control-sm" placeholder="Ej: Ash" 
                           [(ngModel)]="filtros.nombre" (input)="filtrarUsuarios()">
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Apellido</label>
                    <input type="text" class="form-control form-control-sm" placeholder="Ej: Ketchum" 
                           [(ngModel)]="filtros.apellido" (input)="filtrarUsuarios()">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Rol</label>
                    <input type="text" class="form-control form-control-sm" placeholder="Ej: Entrenador" 
                           [(ngModel)]="filtros.rol" (input)="filtrarUsuarios()">
                </div>
            </div>
        </div>

        <div class="table-responsive px-2">
            <table class="table table-pokedex align-middle">
                <thead>
                    <tr class="text-center">
                        <th>ESTADO</th>
                        <th>PERFIL</th>
                        <th>DATOS DEL ENTRENADOR</th>
                        <th>CONTACTO</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let usuario of usuariosFiltrados" [id]="'row_' + usuario.idusuario" 
                        class="align-middle transition-all" [ngClass]="{'usuario-inactivo': !usuario.activacion}">

                        <td class="text-center">
                            <div class="form-check form-switch d-inline-block">
                                <input class="form-check-input" type="checkbox" role="switch"
                                       [checked]="usuario.activacion"
                                       (change)="toggleEstatus(usuario)">
                            </div>
                            <div class="small fw-bold mt-1" [ngClass]="usuario.activacion ? 'text-success' : 'text-danger'">
                                {{ usuario.activacion ? 'ACTIVO' : 'INACTIVO' }}
                            </div>
                        </td>

                        <td class="text-center">
                            <img *ngIf="usuario.imagen" [src]="'data:image/jpeg;base64,' + usuario.imagen"
                                 class="rounded-circle trainer-img" />

                            <ng-container *ngIf="!usuario.imagen">
                                <img *ngIf="usuario.idusuario % 2 === 0"
                                    src="https://cdn-icons-png.flaticon.com/512/361/361998.png"
                                    class="rounded-circle trainer-img" alt="Entrenador Tipo A" />

                                <img *ngIf="usuario.idusuario % 2 !== 0"
                                    src="https://cdn-icons-png.flaticon.com/512/188/188926.png"
                                    class="rounded-circle trainer-img" alt="Entrenador Tipo B" />
                            </ng-container>
                        </td>

                        <td>
                            <div class="fw-bold fs-5" style="color: #2a75bb;">
                                <i class="bi bi-shield-shaded me-1"></i> {{usuario.nombreusuario}}
                                {{usuario.apellidopaterno}}
                            </div>
                            <div class="d-flex gap-2 mt-2">
                                <span class="badge bg-primary badge-trainer">
                                    <i class="bi bi-at"></i> {{usuario.username}}
                                </span>
                                <span class="badge bg-success badge-trainer">
                                    <i class="bi bi-star-fill me-1"></i> {{usuario.rol.nombrerol}}
                                </span>
                            </div>
                        </td>

                        <td>
                            <div class="d-flex align-items-center mb-1">
                                <div class="icon-circle bg-danger text-white me-2 d-flex align-items-center justify-content-center"
                                     style="width: 25px; height: 25px; border-radius: 50%; font-size: 0.8rem;">
                                    <i class="bi bi-envelope"></i>
                                </div>
                                <span class="text-dark fw-medium">{{usuario.correo}}</span>
                            </div>
                            <div class="text-muted ms-4 ps-1" style="font-size: 0.85rem;">
                                <i class="bi bi-fingerprint"></i> ID: #00{{usuario.idusuario}}
                            </div>
                        </td>

                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <button [routerLink]="['/perfil-detalle', usuario.idusuario]"
                                    class="btn btn-sm btn-info btn-poke" title="Ver Perfil y Favoritos">
                                    <i class="bi bi-search text-white"></i>
                                </button>
                                <button (click)="eliminarUsuario(usuario.idusuario)"
                                    class="btn btn-sm btn-danger btn-poke" title="Eliminar Registro">
                                    <i class="bi bi-trash3-fill"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
