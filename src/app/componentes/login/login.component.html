<div class="overlay-container">
  <div class="pokemon-bg-login"></div>

  <div class="pokedex-frame animate-in shadow-lg">
    
    <div class="pokedex-header">
      <div class="main-light-container">
        <div class="light-big-blue" [ngClass]="isLoading ? 'pulse-fast' : 'pulse-blue'"></div>
      </div>
      <div class="small-lights">
        <span class="light-small red"></span>
        <span class="light-small yellow"></span>
        <span class="light-small green"></span>
      </div>
    </div>

    <div class="pokedex-screen">
      <div class="screen-glass">
        <img src="assets/logo.svg" class="img-fluid logo-pokedex" alt="Login Adventure">
      </div>
      <div class="screen-decor">
        <span></span><span></span>
      </div>
    </div>

    <h2 class="title-pixel">¡ENTRENADOR LOGIN!</h2>

    <div class="alert-pokedex-danger animate-alert" *ngIf="errorMessage">
      <div class="alert-icon-wrapper">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>
      <div class="alert-content">
        <span class="alert-title">¡ERROR DE CONEXIÓN!</span>
        <span class="alert-text">{{ errorMessage }}</span>
      </div>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="mt-3">
      <div class="mb-3 text-start">
        <label class="label-pixel">USUARIO DEL ENTRENADOR</label>
        <input
          type="text"
          class="form-control pokedex-input"
          name="username"
          [(ngModel)]="username"
          placeholder="Nombre de usuario"
          required
        />
      </div>

      <div class="mb-4 text-start">
        <label class="label-pixel">CONTRASEÑA</label>
        <input
          type="password"
          class="form-control pokedex-input"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
        />
      </div>

      <button class="btn btn-pokedex-action w-100" type="submit" [disabled]="isLoading">
        <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
          <span class="spinner-border spinner-border-sm poke-spinner" role="status" aria-hidden="true"></span>
          ¡VALIDANDO DATOS...!
        </span>
        <span *ngIf="!isLoading">¡POKÉLOGIN!</span>
      </button>

      <div class="text-center mt-3">
        <button type="button" class="btn register-link" (click)="openRegisterModal()">
          <i class="bi bi-plus-circle-fill"></i> ¿Eres un nuevo Entrenador? Regístrate
        </button>
      </div>

    </form> 
    </div>
</div>

<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content pokedex-modal-frame">
      
      <div class="modal-header border-0">
        <h5 class="modal-title title-pixel fs-5" id="registerModalLabel">NUEVO ENTRENADOR</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">

        <div class="register-logo-container">
          <div class="logo-screen-inner">
            <img src="assets/logo.svg" class="img-fluid logo-registro" alt="Registro Entrenador">
          </div>
          <div class="screen-lights">
            <span class="dot-light"></span>
            <span class="dot-light"></span>
          </div>
        </div>

        <div class="alert-pokedex-danger mb-3" *ngIf="registerError">
          <div class="alert-content">
            <span class="alert-title">¡ERROR EN REGISTRO!</span>
            <span class="alert-text">{{ registerError }}</span>
          </div>
        </div>

        <div class="alert-pokedex-success mb-3" *ngIf="registerSuccess">
          <div class="alert-content">
            <span class="alert-title">¡REGISTRO EXITOSO!</span>
            <span class="alert-text">Ya puedes iniciar sesión.</span>
          </div>
        </div>

        <form (ngSubmit)="onRegister()" #registerForm="ngForm">
  
          <div class="row">
            <div class="col-md-6 mb-3 text-start">
              <label class="label-pixel">NOMBRE</label>
              <input type="text" class="form-control pokedex-input" name="regNombre" [(ngModel)]="regNombre" required />
            </div>
            <div class="col-md-6 mb-3 text-start">
              <label class="label-pixel">APELLIDO PATERNO</label>
              <input type="text" class="form-control pokedex-input" name="regApellidoP" [(ngModel)]="regApellidoP" required />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3 text-start">
              <label class="label-pixel">APELLIDO MATERNO</label>
              <input type="text" class="form-control pokedex-input" name="regApellidoM" [(ngModel)]="regApellidoM" />
            </div>
            <div class="col-md-6 mb-3 text-start">
              <label class="label-pixel">USUARIO</label>
              <input type="text" class="form-control pokedex-input" name="regUsername" [(ngModel)]="regUsername" required />
            </div>
          </div>

          <div class="row">
            <div class="col-12 mb-3 text-start">
              <label class="label-pixel">CORREO ELECTRÓNICO</label>
              <input type="email" class="form-control pokedex-input" name="regCorreo" [(ngModel)]="regCorreo" required />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3 text-start">
              <label class="label-pixel">CONTRASEÑA</label>
              <input type="password" class="form-control pokedex-input" name="regPassword" [(ngModel)]="regPassword" required />
            </div>
            <div class="col-md-6 mb-3 text-start">
              <label class="label-pixel">CONFIRMAR</label>
              <input type="password" class="form-control pokedex-input" 
                    name="regConfirmPassword" 
                    [(ngModel)]="regConfirmPassword" 
                    required
                    [ngClass]="{'input-error': regPassword !== regConfirmPassword && regConfirmPassword.length > 0}" />
            </div>
          </div>

          <div class="row" *ngIf="regConfirmPassword.length > 0">
            <div class="col-12 text-center mb-3">
              <div class="password-status-text">
                <span *ngIf="regPassword === regConfirmPassword" class="text-success-pixel">¡COINCIDEN!</span>
                <span *ngIf="regPassword !== regConfirmPassword" class="text-danger-pixel">¡NO COINCIDEN!</span>
              </div>
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-12">
              <button class="btn btn-pokedex-action w-100" 
                      type="submit" 
                      [disabled]="isRegistering || registerForm.invalid || regPassword !== regConfirmPassword">
                <span *ngIf="isRegistering" class="spinner-border spinner-border-sm poke-spinner me-2"></span>
                {{ isRegistering ? 'REGISTRANDO...' : '¡DAR DE ALTA ENTRENADOR!' }}
              </button>
            </div>
          </div>

        </form>

        
      </div>

    </div>
  </div>
</div>
